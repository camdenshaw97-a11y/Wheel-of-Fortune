<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2a0f7a">
<title>Play</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%23ffcc33'/%3E%3Cpath d='M32 32 L32 2 A30 30 0 0 1 58 17 Z' fill='%23e8352b'/%3E%3Cpath d='M32 32 L58 17 A30 30 0 0 1 58 47 Z' fill='%231f8be0'/%3E%3Cpath d='M32 32 L58 47 A30 30 0 0 1 32 62 Z' fill='%233bb54a'/%3E%3Cpath d='M32 32 L32 62 A30 30 0 0 1 6 47 Z' fill='%238a3fd1'/%3E%3Cpath d='M32 32 L6 47 A30 30 0 0 1 6 17 Z' fill='%23f28a1d'/%3E%3Cpath d='M32 32 L6 17 A30 30 0 0 1 32 2 Z' fill='%23ef4f9a'/%3E%3Ccircle cx='32' cy='32' r='7' fill='%23fff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/style.css">
<style>
  html, body { margin: 0; min-height: 100%; background: #13063f; color: #fff; font-family: var(--text); -webkit-tap-highlight-color: transparent; }
  body { background: radial-gradient(ellipse 120% 60% at 50% 0%, #4b20b8 0%, #2a0f7a 45%, #13063f 100%) fixed; }
  * { box-sizing: border-box; }
  button { font-family: inherit; }
  .view { display: none; min-height: var(--vh, 100vh); padding: max(10px, env(safe-area-inset-top)) 12px max(18px, env(safe-area-inset-bottom)); max-width: 560px; margin: 0 auto; }
  .view.on { display: block; animation: vIn .3s ease-out; }
  @keyframes vIn { from { opacity: 0; transform: translateY(12px); } }
  .disp { font-family: var(--display); font-weight: 400; letter-spacing: .04em; }

  /* ---- join ---- */
  .j-wrap { padding-top: 6vh; display: flex; flex-direction: column; align-items: center; }
  .j-logo { display: flex; flex-direction: column; align-items: center; gap: 10px; margin-bottom: 22px; }
  .j-logo .whl { width: 110px; height: 110px; animation: logoSpin 14s linear infinite; filter: drop-shadow(0 8px 16px #000a); }
  @keyframes logoSpin { to { transform: rotate(360deg); } }
  .j-logo b { font: 400 50px/1 var(--display); letter-spacing: .04em; text-shadow: 0 3px 0 #c98a06, 0 5px 0 #6b3d00; -webkit-text-stroke: 1.5px #3a1700; paint-order: stroke fill; }
  .j-card { width: 100%; background: #26107acc; border-radius: 22px; padding: 18px 18px 14px; box-shadow: 0 0 0 3px #ffcc33, 0 18px 40px #0009; }
  .j-card label { display: flex; justify-content: space-between; font: 700 13px var(--text); letter-spacing: .08em; color: #d3c6ff; margin: 8px 2px 6px; }
  .j-card label span:last-child { color: #a490e0; font-weight: 600; letter-spacing: 0; }
  .j-card input { width: 100%; font: 800 26px var(--letter); text-transform: uppercase; letter-spacing: .06em; color: #111; background: #fff; border: 0; border-radius: 12px; padding: 12px 14px; outline: none; box-shadow: inset 0 -3px 0 #0002; }
  .j-card input#code { letter-spacing: .4em; text-align: center; font-size: 34px; }
  .j-card input:focus { box-shadow: 0 0 0 3px var(--gold); }
  .j-play { width: 100%; margin-top: 16px; font: 400 32px var(--display); letter-spacing: .06em; color: #2a1800; background: linear-gradient(#ffe27a, #f2b01e); border: 0; border-radius: 999px; padding: 14px 0 10px; box-shadow: 0 6px 0 #8a5200; opacity: .55; transition: opacity .2s, transform .08s; }
  .j-play.ready { opacity: 1; }
  .j-play:active, .j-play[data-fx-press] { transform: translateY(4px); box-shadow: 0 2px 0 #8a5200; }
  .j-play.busy { animation: breathe 1.1s ease-in-out infinite; }
  @keyframes breathe { 50% { opacity: .55; } }
  #joinErr { color: #ffb4ae; font-weight: 700; min-height: 22px; margin: 12px 0 0; text-align: center; }
  #joinWait { color: #d3c6ff; margin: 6px 0 0; text-align: center; font-size: 14px; }
  .fine { color: #b3a3ee; font-size: 14px; text-align: center; line-height: 1.5; margin-top: 18px; }
  .fine a { color: #fff; }
  .ver { color: #8a76d6; font-size: 12px; letter-spacing: .08em; margin-top: 10px; }
  #deskTv { display: none; width: 100%; text-align: center; margin-bottom: 16px; }
  #deskTv p { color: #d3c6ff; margin: 0 0 10px; }
  #deskTv span { display: block; margin-top: 14px; font: 700 12px var(--text); letter-spacing: .12em; color: #a490e0; }
  .tvbtn { display: inline-block; font: 400 24px var(--display); letter-spacing: .05em; color: #fff; text-decoration: none; background: linear-gradient(#8a5cff, #5a2fd6); border-radius: 999px; padding: 12px 26px 9px; box-shadow: 0 5px 0 #2a0d6e; }
  @media (hover: hover) and (pointer: fine) { #deskTv { display: block; } .tvhint { display: none; } }
  #join.hascode #deskTv { display: none; }

  /* ---- shared bits ---- */
  .bar { display: flex; justify-content: space-between; align-items: center; font: 700 13px var(--text); letter-spacing: .08em; color: #d3c6ff; padding: 4px 4px 10px; }
  .bar b { color: #fff; }
  .card { background: #26107acc; border-radius: 18px; padding: 14px; margin-bottom: 12px; box-shadow: 0 10px 30px #0006, inset 0 1px 0 #ffffff22; }
  .card.mine { box-shadow: 0 0 0 2px var(--gold), 0 10px 30px #0006; }
  .card h3 { display: flex; justify-content: space-between; align-items: baseline; margin: 0 0 10px; font: 400 22px var(--display); letter-spacing: .06em; color: var(--gold); }
  .card h3 small { font: 700 12px var(--text); letter-spacing: .08em; color: #b3a3ee; }
  .who { display: flex; flex-wrap: wrap; gap: 6px; }
  .who span { display: inline-flex; align-items: center; gap: 6px; font: 700 15px var(--text); padding: 6px 12px; border-radius: 999px; background: #ffffff14; }
  .who span.me { background: var(--gold); color: #2a1800; }
  .who span.off { opacity: .5; }
  .who span i { width: 12px; height: 12px; border-radius: 50%; flex: none; }
  .who span button { border: 0; background: #0004; color: #fff; width: 22px; height: 22px; border-radius: 50%; font-weight: 800; line-height: 1; padding: 0; }
  .who em { color: #b3a3ee; }
  .btn { display: block; width: 100%; margin-top: 10px; font: 400 26px var(--display); letter-spacing: .05em; color: #fff; background: linear-gradient(#8a5cff, #5a2fd6); border: 0; border-radius: 999px; padding: 13px 10px 10px; box-shadow: 0 5px 0 #2a0d6e; transition: transform .08s, box-shadow .08s, opacity .2s; }
  .btn:active:not(:disabled), .btn[data-fx-press]:not(:disabled) { transform: translateY(4px); box-shadow: 0 1px 0 #2a0d6e; }
  .btn.gold { color: #2a1800; background: linear-gradient(#ffe27a, #f2b01e); box-shadow: 0 5px 0 #8a5200; }
  .btn.green { color: #06301f; background: linear-gradient(#7dffb8, #2bbd6e); box-shadow: 0 5px 0 #11603a; }
  .btn.red { background: linear-gradient(#ff6a60, #c41410); box-shadow: 0 5px 0 #5a0905; }
  .btn.ghost { background: transparent; box-shadow: inset 0 0 0 2px #7a5fd6; }
  .btn.sm { font-size: 19px; padding: 10px 8px 8px; }
  .btn.big { font-size: 32px; padding: 16px 10px 12px; }
  .btn:disabled { opacity: .4; }
  .btn.glow { animation: glow 1.6s ease-in-out infinite; }
  @keyframes glow { 50% { box-shadow: 0 5px 0 #8a5200, 0 0 30px #ffcc33aa; } }
  .note { color: #d3c6ff; font-size: 14px; line-height: 1.45; margin: 10px 2px 0; text-align: center; }
  .link { display: block; text-align: center; margin: 18px 0 8px; color: #b3a3ee; font-size: 14px; }
  .toggle { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 9px 0; border-bottom: 1px solid #ffffff14; font-weight: 700; font-size: 15px; }
  .toggle small { display: block; font-weight: 400; color: #b3a3ee; font-size: 13px; margin-top: 2px; }
  .toggle .tag { font: 800 10px var(--text); background: var(--red); color: #fff; padding: 2px 6px; border-radius: 999px; margin-left: 6px; vertical-align: 2px; }
  .sw { flex: none; width: 52px; height: 30px; border-radius: 999px; border: 0; background: #ffffff26; position: relative; transition: background .2s; }
  .sw::after { content: ""; position: absolute; left: 3px; top: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; transition: transform .2s; }
  .sw.on { background: #2bbd6e; }
  .sw.on::after { transform: translateX(22px); }
  .seg { display: flex; gap: 6px; margin: 8px 0 2px; }
  .seg button { flex: 1; border: 0; border-radius: 10px; padding: 10px 4px; font: 700 15px var(--text); color: #fff; background: #ffffff1a; }
  .seg button.on { background: var(--gold); color: #2a1800; }
  .label { font: 700 12px var(--text); letter-spacing: .1em; color: #b3a3ee; margin: 12px 2px 4px; }

  /* ---- play ---- */
  .top { display: flex; align-items: center; gap: 10px; padding: 2px 2px 10px; }
  .top .dot { width: 16px; height: 16px; border-radius: 50%; flex: none; box-shadow: 0 0 0 3px #fff3; }
  .top .nm { font: 400 24px/1 var(--display); letter-spacing: .05em; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-top: 3px; }
  .top .money { text-align: right; font: 800 22px/1 var(--letter); }
  .top .money small { display: block; font: 700 11px var(--text); letter-spacing: .08em; color: #d3c6ff; margin-top: 3px; }
  .scores { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 8px; margin: 0 -2px; scrollbar-width: none; }
  .scores::-webkit-scrollbar { display: none; }
  .scores div { flex: none; border-radius: 10px; padding: 5px 9px 4px; background: linear-gradient(var(--c1), var(--c2)); font: 700 12px var(--text); line-height: 1.2; white-space: nowrap; box-shadow: 0 2px 0 #0005; transition: transform .2s, box-shadow .2s; }
  .scores div b { display: block; font: 800 15px var(--letter); }
  .scores div.up { box-shadow: 0 0 0 2px #fff, 0 0 16px #fffa; transform: translateY(-2px); }
  .scores div.out { opacity: .4; }
  .catline { text-align: center; font: 400 18px var(--display); letter-spacing: .1em; color: #fff; background: #172fa8; border-radius: 999px; padding: 5px 10px 3px; margin: 6px auto 0; width: fit-content; max-width: 100%; box-shadow: 0 0 0 2px #4a6bff; }
  .used { display: grid; grid-template-columns: repeat(13, 1fr); gap: 4px; margin: 12px 0 4px; }
  .used i { font: 800 clamp(18px, 5.6vw, 26px)/1 var(--letter); font-style: normal; color: #fff; text-align: center; padding: 5px 0 4px; border-radius: 6px; background: #ffffff14; }
  .used i.v { background: #ffcc3322; }
  .used i.v { color: var(--gold); }
  .used i.done { opacity: .2; background: transparent; text-decoration: line-through; }
  .say { text-align: center; padding: 16px 6px 6px; }
  .say b { display: block; font: 400 38px/1.05 var(--display); letter-spacing: .04em; color: var(--gold); }
  .say span { display: block; font: 600 16px/1.4 var(--text); color: #e6dcff; margin-top: 6px; }
  .say.good b { color: #7dffb8; } .say.bad b { color: #ff8a80; }
  .clock { height: 8px; border-radius: 4px; background: #ffffff1f; overflow: hidden; margin: 8px 4px 0; }
  .clock i { display: block; height: 100%; width: 100%; background: #fff; transform-origin: left; }
  .clock.hot i { background: #ff6a60; }

  /* the spin pad: swipe across the wheel */
  .pad { position: relative; width: min(78vw, 330px); aspect-ratio: 1; margin: 22px auto 4px; touch-action: none; user-select: none; -webkit-user-select: none; cursor: grab; }
  .pad .whl { position: absolute; inset: 0; border-radius: 50%; }
  .pad .whl svg { display: block; width: 100%; height: 100%; filter: drop-shadow(0 12px 22px #000c); }
  .pad .ptr { position: absolute; left: 50%; top: -14px; margin-left: -16px; border-left: 16px solid transparent; border-right: 16px solid transparent; border-top: 32px solid #fff; z-index: 2; filter: drop-shadow(0 3px 0 #120538); }
  .pad .hint { position: absolute; left: 50%; bottom: -6px; transform: translateX(-50%); font: 400 18px var(--display); letter-spacing: .1em; background: #120538; color: #fff; padding: 7px 14px 4px; border-radius: 999px; white-space: nowrap; box-shadow: 0 0 0 2px var(--gold); pointer-events: none; }
  .pad.live .hint { animation: hint 1.6s ease-in-out infinite; }
  @keyframes hint { 50% { transform: translate(-50%, -4px); } }
  .pad.off { pointer-events: none; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
  .row2 .btn { margin-top: 0; }

  /* letter keyboards */
  .keys { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-top: 12px; }
  .keys.v { grid-template-columns: repeat(5, 1fr); }
  .keys button { aspect-ratio: 1 / 1.08; border: 0; border-radius: 10px; font: 800 24px var(--letter); color: #111; background: #fff; box-shadow: 0 4px 0 #9d90c9; transition: transform .07s; padding: 0; }
  .keys button:active:not(:disabled), .keys button[data-fx-press]:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 #9d90c9; }
  .keys button:disabled { background: #ffffff26; color: #ffffff55; box-shadow: none; }
  .keys button.pk { background: var(--gold); box-shadow: 0 4px 0 #8a5200; }
  .keys.v button { font-size: 28px; }

  /* typing a solve */
  .solve input { width: 100%; font: 800 22px var(--letter); text-transform: uppercase; color: #111; background: #fff; border: 0; border-radius: 12px; padding: 14px; outline: none; letter-spacing: .03em; }
  .solve input:focus { box-shadow: 0 0 0 3px var(--gold); }
  .tries { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
  .tries span { font: 700 13px var(--text); padding: 4px 10px; border-radius: 999px; background: #7a1512; text-decoration: line-through; }

  /* the toss-up buzzer */
  .buzz { display: block; width: min(76vw, 300px); aspect-ratio: 1; margin: 22px auto 6px; border-radius: 50%; border: 0; font: 400 52px var(--display); letter-spacing: .05em; color: #fff; background: radial-gradient(circle at 40% 30%, #ff8a80, #e8352b 45%, #9b120b); box-shadow: 0 12px 0 #5a0905, 0 0 0 8px #ffffff22, 0 24px 40px #0009; transition: transform .07s, box-shadow .07s; touch-action: manipulation; }
  .buzz.down, .buzz:active { transform: translateY(9px); box-shadow: 0 3px 0 #5a0905, 0 0 0 8px #ffffff22; }
  .buzz:disabled { filter: grayscale(.9) brightness(.6); }

  .ranks div { display: flex; justify-content: space-between; padding: 8px 2px; border-bottom: 1px solid #ffffff14; font-weight: 700; }
  .ranks div b { font-family: var(--letter); }
  .stats { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  .stats div { background: #ffffff10; border-radius: 12px; padding: 10px 6px; text-align: center; font: 700 11px var(--text); letter-spacing: .06em; color: #d3c6ff; }
  .stats div b { display: block; font: 400 24px var(--display); color: #fff; letter-spacing: .02em; margin-bottom: 2px; }
  .award { display: inline-block; font: 700 12px var(--text); letter-spacing: .06em; background: var(--gold); color: #2a1800; border-radius: 999px; padding: 4px 10px; margin: 0 4px 4px 0; }

  /* host */
  .answer { background: #fff; color: #111; border-radius: 14px; padding: 12px 14px; font: 800 20px/1.25 var(--letter); text-align: center; letter-spacing: .02em; }
  .answer small { display: block; font: 700 11px var(--text); letter-spacing: .1em; color: #6a5aa0; margin-bottom: 4px; }
  .hgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .hgrid .btn { margin-top: 0; }
  .adj { display: flex; align-items: center; gap: 6px; padding: 7px 0; border-bottom: 1px solid #ffffff14; }
  .adj span { flex: 1; font-weight: 700; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .adj b { width: 78px; text-align: right; font-family: var(--letter); }
  .adj button { border: 0; border-radius: 8px; background: #ffffff1f; color: #fff; font: 700 13px var(--text); padding: 7px 8px; }

  #pop { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; z-index: 50; pointer-events: none; }
  #pop.on { display: flex; }
  #pop > div { padding: 22px 28px 18px; border-radius: 24px; text-align: center; animation: popIn .32s cubic-bezier(.2, 1.4, .4, 1); max-width: 88vw; }
  #pop.out > div { animation: popOut .25s ease-in forwards; }
  @keyframes popIn { from { transform: scale(.3); opacity: 0; } }
  @keyframes popOut { to { transform: scale(.8); opacity: 0; } }
  #pop b { display: block; font: 400 48px/1 var(--display); letter-spacing: .03em; }
  #pop span { display: block; font: 700 17px var(--text); margin-top: 6px; }
  #pop.good > div { color: #06301f; background: linear-gradient(#7dffb8, #2bbd6e); box-shadow: 0 0 0 5px #fff, 0 20px 50px #000c; }
  #pop.bad > div { color: #fff; background: linear-gradient(#333, #000); box-shadow: 0 0 0 5px var(--red), 0 20px 50px #000c; }
  #pop.turn > div { color: #2a1800; background: linear-gradient(#ffe27a, #f2b01e); box-shadow: 0 0 0 5px #fff, 0 20px 50px #000c; }
  #toast { position: fixed; left: 50%; bottom: max(20px, env(safe-area-inset-bottom)); transform: translateX(-50%); background: #120538; color: #fff; font-weight: 700; font-size: 15px; padding: 10px 18px; border-radius: 999px; box-shadow: 0 0 0 2px var(--gold), 0 10px 30px #000a; z-index: 60; display: none; max-width: 92vw; text-align: center; }
  #toast.on { display: block; animation: popIn .25s ease-out; }
  #toast.out { animation: popOut .2s ease-in forwards; }
  #offline { position: fixed; left: 50%; top: max(8px, env(safe-area-inset-top)); transform: translateX(-50%); background: #7a1512; color: #fff; font-weight: 700; font-size: 14px; padding: 7px 16px; border-radius: 999px; z-index: 70; display: none; white-space: nowrap; }
  #offline.on { display: block; }
  .menu { position: fixed; inset: 0; z-index: 80; background: #13063ff2; overflow: auto; padding: max(14px, env(safe-area-inset-top)) 12px 30px; animation: vIn .25s ease-out; }
  .menu.out { animation: popOut .2s ease-in forwards; }
  .menu .in { max-width: 560px; margin: 0 auto; }
</style>
</head>
<body>

<section class="view on" id="join">
  <div class="j-wrap">
    <div class="j-logo"><div class="whl" data-logo></div><b data-title></b></div>
    <div id="deskTv">
      <p>Is this the computer plugged into the TV?</p>
      <a class="tvbtn" href="/tv">SHOW THE GAME BOARD HERE</a>
      <span>OR JOIN AS A PLAYER</span>
    </div>
    <form id="joinForm" class="j-card" autocomplete="off">
      <label for="code"><span>ROOM CODE</span><span>4 letters, on the TV</span></label>
      <input id="code" maxlength="4" placeholder="••••" autocapitalize="characters" autocorrect="off" spellcheck="false">
      <label for="name"><span>YOUR NAME</span><span id="nameLeft">12</span></label>
      <input id="name" maxlength="12" placeholder="Type your name" autocapitalize="characters" autocorrect="off" spellcheck="false">
      <button class="j-play" id="playBtn">PLAY</button>
      <p id="joinErr"></p>
      <p id="joinWait"></p>
    </form>
    <p class="fine">Tip: scan the code on the TV to skip the typing.<span class="tvhint"><br>Setting up the TV? <a href="/tv">Open the game board</a> on the computer connected to it.</span></p>
    <p class="ver" id="ver"></p>
  </div>
</section>

<section class="view" id="lobby"></section>
<section class="view" id="play"></section>
<section class="view" id="host"></section>

<div id="pop"><div><b></b><span></span></div></div>
<div id="toast"></div>
<div id="offline">Reconnecting…</div>

<script src="/common.js"></script>
<script src="/board.js"></script>
<script src="/editor.js"></script>
<script>
(function () {
  'use strict';
  var F = window.Game, $ = F.$, esc = F.esc, money = F.money, sfx = F.sfx;
  var sess = F.store.get('whl.me', null);      // { code, token, name }
  var S = null, me = null, conn = null, hello = null, lastSeq = null;
  var triedRejoinByName = false, typed = false;
  var waiting = false, waited = false, waitTimer = null, online = false, LIVE_MS = 15 * 60 * 1000;
  var menuOpen = false, editorOpen = false, ui = {};   // ui: what this phone has open (the vowel picker, bonus picks)
  var COLORS = [['#ff5a4e', '#c4231a'], ['#ffd23f', '#d69a00'], ['#3d8bff', '#1a4fc4'], ['#3fd47a', '#1b9450'], ['#b26bff', '#7a2fd6'], ['#ff9a3d', '#d0610c'], ['#ff6fb5', '#cc2f7f'], ['#2fd6d0', '#11908b']];
  var CONS = 'BCDFGHJKLMNPQRSTVWXYZ'.split(''), VOW = 'AEIOU'.split('');

  function waitForGame() {
    waiting = true; waited = true;
    var bar = $('#offline');
    bar.textContent = 'Hang tight. Bringing your game back…';
    bar.classList.add('on');
    clearTimeout(waitTimer);
    waitTimer = setTimeout(function () { if (waiting && conn && hello) conn.send(hello); }, 2000);
  }
  function stopWaiting() {
    if (!waiting) return;
    waiting = false; clearTimeout(waitTimer);
    var bar = $('#offline');
    bar.classList.remove('on'); bar.textContent = 'Reconnecting…';
  }

  document.querySelectorAll('[data-title]').forEach(function (n) { n.textContent = F.TITLE; });
  document.querySelectorAll('[data-logo]').forEach(function (n) { n.innerHTML = F.wheelSvg([2500, 600, 700, 600, 650, 500, 700, 'BANKRUPT', 600, 550, 500, 900, 'LOSE A TURN', 650, 700, 800, 500, 650, 'BANKRUPT', 500, 900, 550, 600, 800]); });
  document.title = F.TITLE;
  $('#ver').textContent = 'VERSION ' + F.VERSION;
  F.pressFx();

  function show(id) { document.querySelectorAll('.view').forEach(function (n) { n.classList.toggle('on', n.id === id); }); }
  var toastTimer, toastOut;
  function toast(msg) {
    var t = $('#toast');
    clearTimeout(toastTimer); clearTimeout(toastOut);
    t.textContent = msg; t.classList.remove('out');
    if (t.classList.contains('on')) F.bump(t, 1.06); else t.classList.add('on');

    }
    else if (ph === 'bonusSolve') main = say('SOLVE IT!', 'Keep guessing until the clock runs out.') + clockBar() + solveBox('TYPE THE PUZZLE', 'Try it') +
      (g.bonus.guesses.length ? '<div class="tries" data-key="tries">' + g.bonus.guesses.slice(-6).map(function (x) { return '<span>' + esc(x) + '</span>'; }).join('') + '</div>' : '');
    else if (ph === 'bonusDone') main = say(g.bonus.solved ? (me.bonus ? 'YOU WON ' : pname(g.bonus.pid) + ' WON ') + money(g.bonus.prize) + '!' : 'IT WAS ' + money(g.bonus.prize), g.answer, g.bonus.solved ? 'good' : 'bad');
    else if (ph === 'gameOver') main = endBlock(g);
    h += '<div data-key="main-' + ph + (ui.vowels ? 'v' : '') + '">' + main + '</div>';
    if (ph !== 'gameOver') h += boardBlock(g);
    F.morph($('#play'), h);
    afterPaint(g, ph);
    bigMoments(has, g);
  }

  function endBlock(g) {
    var ranked = S.players.slice().sort(function (a, b) { return (g.total[b.id] || 0) - (g.total[a.id] || 0); });
    var won = (g.winner || []).indexOf(me.id) >= 0, st = me.stats || {};
    var names = { solver: 'MOST SOLVES', caller: 'BEST LETTER CALLER', big: 'BIGGEST SINGLE CALL', bankrupt: 'BANKRUPT MAGNET' };
    var h = say(won ? 'YOU WIN!' : 'GAME OVER', won ? money(me.total) + ' total' : ((g.winner || []).map(pname).join(' & ') || 'Nobody') + ' wins', won ? 'good' : '');
    if (me.playing) h += '<div class="card" data-key="stats"><h3><span>YOUR GAME</span></h3>' + ((me.awards || []).map(function (k) { return '<span class="award">' + names[k] + '</span>'; }).join('')) +
      '<div class="stats"><div><b>' + (st.hits || 0) + '</b>GOOD LETTERS</div><div><b>' + ((st.solves || 0) + (st.tosses || 0)) + '</b>SOLVES</div><div><b>' + (st.bankrupts || 0) + '</b>BANKRUPTS</div></div></div>';
    h += '<div class="card ranks" data-key="ranks">' + ranked.map(function (p, i) { return '<div><span>' + (i + 1) + '. ' + esc(p.name) + '</span><b>' + money(g.total[p.id] || 0) + '</b></div>'; }).join('') + '</div>';
    if (me.isCaptain || me.isHost) h += '<button class="btn gold big" data-a="again">Back to the lobby</button>';
    else h += '<p class="note">' + (S.host ? esc(S.host.name) : 'The captain') + ' can start another game.</p>';
    return h;
  }

  // Things that need a script after drawing: the wheel on the spin pad, clocks, keeping focus.
  var padSpin = null, padKey = null, clockRaf = null;
  function afterPaint(g, ph) {
    var w = $('#padWheel');
    if (w) {
      var k = g.wheel.kind + '|' + g.wheel.wedges.join(',');
      if (w.getAttribute('data-k') !== k) { w.setAttribute('data-k', k); w.innerHTML = F.wheelSvg(g.wheel.wedges, g.wheel.kind === 'bonus' ? 'bonus' : null); padSpin = F.spinner(w, function () { sfx.peg(); }); padKey = null; }
      if (!dragging) padSpin.sync(g.wheel);
      $('#pad').classList.toggle('off', ph === 'spinning' || ph === 'bonusSpinning');
      $('#pad').classList.toggle('live', ph === 'turn' || ph === 'bonusSpin');
    } else padSpin = null;
    var cl = document.querySelector('[data-key=clock]');
    if (clockRaf) cancelAnimationFrame(clockRaf);
    if (cl && g.clock) {
      var ends = performance.now() + g.clock.left, len = g.clock.len;
      (function step(now) {
        var left = Math.max(0, ends - now);
        cl.firstChild.style.transform = 'scaleX(' + (left / len) + ')';
        cl.classList.toggle('hot', left < 3000);
        if (left > 0) clockRaf = requestAnimationFrame(step);
      })(performance.now());
    }
    var si = $('#solveIn');
    if (si && document.activeElement !== si && si.getAttribute('data-auto') !== ph) { si.setAttribute('data-auto', ph); try { si.focus(); } catch (e) { /* ignore */ } }
  }

  function bigMoments(has, g) {
    if (has.joined && has.joined.name !== me.name) toast(has.joined.name + ' jumped in!');
    if (has.turn && g.control === me.id) { pop('turn', 'YOUR TURN', '', 1100); buzzPhone([60, 40, 60]); sfx.join(); }
    if (has.round && g.control === me.id) { pop('turn', 'YOU START', 'Round ' + g.round, 1400); buzzPhone([60, 40, 60]); }
    if (has.letter && has.letter.name === me.name && has.letter.won) { pop('good', '+' + money(has.letter.won), lettersSay(has.letter), 1100); buzzPhone(40); }
    if (has.miss && has.miss.name === me.name) { pop('bad', 'NO ' + has.miss.letter, 'Turn passes', 1200); buzzPhone([90, 50, 90]); }
    if (has.bankrupt && has.bankrupt.name === me.name) { pop('bad', 'BANKRUPT', 'Ouch.', 1600); buzzPhone([200, 80, 200]); }
    if (has.loseTurn && has.loseTurn.name === me.name) { pop('bad', 'LOSE A TURN', '', 1400); buzzPhone([120, 60, 120]); }
    if (has.landed && has.landed.name === me.name) { buzzPhone(30); }
    if (has.wrongSolve && has.wrongSolve.name === me.name) { pop('bad', 'NOT IT', 'Turn passes', 1300); buzzPhone([90, 50, 90]); }
    if (has.timeUp && has.timeUp.name === me.name) { pop('bad', 'TIME’S UP', 'Turn passes', 1300); }
    if (has.tossWrong && has.tossWrong.name === me.name) { pop('bad', has.tossWrong.time ? 'TIME’S UP' : 'NOT IT', 'You’re out of this one', 1400); buzzPhone([90, 50, 90]); }
    if ((has.solved && has.solved.name === me.name) || (has.tossRight && has.tossRight.name === me.name)) { pop('good', 'SOLVED!', '+' + money(has.solved ? has.solved.won : has.tossRight.value), 1800); buzzPhone([60, 40, 60, 40, 160]); }
    if (has.bonusWrong && me.bonus) { var si = $('#solveIn'); if (si) { si.value = ''; F.shake(si); } buzzPhone(60); }
    if (has.win && (g.winner || []).indexOf(me.id) >= 0) { setTimeout(function () { pop('good', 'YOU WIN!', '', 2200); }, 400); buzzPhone([80, 60, 80, 60, 200]); }
  }
  function lettersSay(e) { return e.count === 1 ? 'One ' + e.letter : e.count + ' ' + e.letter + '’s'; }

  // Taps in the play area.
  $('#play').addEventListener('click', function (e) {
    var b = e.target.closest('[data-a]'); if (!b || b.disabled) return;
    var a = b.dataset.a, g = S && S.game;
    sfx.unlock();
    if (a === 'buzz') { b.classList.add('down'); setTimeout(function () { b.classList.remove('down'); }, 150); send({ t: 'buzz' }); buzzPhone(30); }
    else if (a === 'call') send({ t: 'call', letter: b.dataset.l });
    else if (a === 'vowels') { ui.vowels = true; render([]); }
    else if (a === 'noVowel') { ui.vowels = false; render([]); }
    else if (a === 'vowel') { ui.vowels = false; send({ t: 'vowel', letter: b.dataset.l }); }
    else if (a === 'solve') send({ t: 'solve' });
    else if (a === 'cancelSolve') send({ t: 'cancelSolve' });
    else if (a === 'guess') submitGuess();
    else if (a === 'pick') {
      var p = ui.picks || (ui.picks = []), L = b.dataset.l, i = p.indexOf(L);
      if (i >= 0) p.splice(i, 1);
      else {
        var isV = VOW.indexOf(L) >= 0, nv = p.filter(function (x) { return VOW.indexOf(x) >= 0; }).length, nc = p.length - nv;
        if (isV && nv >= 1) p.splice(p.indexOf(p.filter(function (x) { return VOW.indexOf(x) >= 0; })[0]), 1);
        if (!isV && nc >= 3) { toast('That’s 3 consonants. Tap one to drop it.'); return; }
        p.push(L);
      }
      render([]);
    }
    else if (a === 'lockPicks') send({ t: 'picks', letters: ui.picks });
    else if (a === 'again') H('lobby');
    else if (a === 'joinplay') send({ t: 'play', on: true });
    else if (a === 'behost') send({ t: 'host', on: true });
  });
  function submitGuess() {
    var si = $('#solveIn'); if (!si) return;
    var v = si.value.trim();
    if (!v) { F.shake(si); return; }
    send({ t: 'guess', text: v });
    if (S.phase !== 'bonusSolve') si.blur(); else si.value = '';
  }
  $('#play').addEventListener('keydown', function (e) { if (e.target.id === 'solveIn' && e.key === 'Enter') { e.preventDefault(); submitGuess(); } });

  /* The spin: drag the wheel round with a finger and let go. The faster the flick, the harder it spins. */
  var dragging = false, drag = null;
  function padAngle(e, el) { var r = el.getBoundingClientRect(); return Math.atan2(e.clientX - (r.left + r.width / 2), -(e.clientY - (r.top + r.height / 2))) * 180 / Math.PI; }
  $('#play').addEventListener('pointerdown', function (e) {
    var pad = e.target.closest('#pad');
    if (!pad || pad.classList.contains('off') || !padSpin || !S || !(S.phase === 'turn' || S.phase === 'bonusSpin')) return;
    e.preventDefault();
    sfx.unlock();
    try { pad.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
    dragging = true;
    var a = padAngle(e, pad);
    drag = { pad: pad, last: a, base: padSpin.angle(), turned: 0, pts: [{ t: performance.now(), x: e.clientX, y: e.clientY, a: 0 }] };
  });
  $('#play').addEventListener('pointermove', function (e) {
    if (!dragging || !drag) return;
    var a = padAngle(e, drag.pad), d = a - drag.last;
    if (d > 180) d -= 360; if (d < -180) d += 360;
    drag.last = a; drag.turned += d;
    padSpin.set(drag.base + Math.max(0, Math.min(30, drag.turned)));
    drag.pts.push({ t: performance.now(), x: e.clientX, y: e.clientY, a: drag.turned });
    if (drag.pts.length > 30) drag.pts.shift();
  });
  function endDrag(e) {
    if (!dragging || !drag) return;
    dragging = false;
    var now = performance.now(), pts = drag.pts.filter(function (p) { return now - p.t < 140; });
    if (pts.length < 2) pts = drag.pts.slice(-2);
    var p0 = pts[0], p1 = pts[pts.length - 1], dt = Math.max(16, p1.t - p0.t);
    var dist = Math.hypot(p1.x - p0.x, p1.y - p0.y), speed = dist / dt;                  // px per ms
    var total = Math.hypot(e.clientX - drag.pts[0].x, e.clientY - drag.pts[0].y);
    var turnedRight = p1.a - p0.a >= 0;
    drag = null;
    if (speed < 0.35 || total < 40 || !turnedRight) {
      if (padSpin && S) padSpin.sync(S.game.wheel);
      toast(turnedRight ? 'Give it a real swipe! Flick it to the right.' : 'The wheel only turns one way: swipe to the right.');
      return;
    }
    var power = Math.max(0, Math.min(1, (speed - 0.35) / 2.4));
    send({ t: 'spin', power: power });
    buzzPhone(25);
  }
  $('#play').addEventListener('pointerup', endDrag);
  $('#play').addEventListener('pointercancel', function () { if (dragging) { dragging = false; drag = null; if (padSpin && S) padSpin.sync(S.game.wheel); } });

  /* ------------------------------------------------------------- host */
  function renderHost(has) {
    var g = S.game, ph = S.phase, hv = S.hostView || {}, L = g.last;
    var h = '<div class="bar"><span>ROOM <b>' + esc(S.code) + '</b></span><span>HOST · ' + esc(me.name) + '</span></div>';
    h += scoresHtml(g);
    if (hv.answer) h += '<div class="answer" data-key="ans"><small>' + esc(g.cat || '') + ' · ONLY YOU SEE THIS</small>' + esc(hv.answer) + '</div>';
    var now = '';
    if (ph === 'toss') now = 'Toss-up · letters going up';
    else if (ph === 'tossAnswer') now = pname(g.toss.buzzed) + ' is typing a toss-up answer';
    else if (ph === 'tossWon') now = g.toss.winner ? pname(g.toss.winner) + ' solved the toss-up' : 'Nobody got the toss-up';
    else if (ph === 'turn') now = pname(g.control) + '’s turn';
    else if (ph === 'spinning') now = pname(g.control) + ' is spinning';
    else if (ph === 'call') now = pname(g.control) + ' landed on ' + money(g.landed) + ' and is calling a letter';
    else if (ph === 'lighting' && L) now = (L.count === 1 ? 'One ' : L.count + ' ') + L.letter;
    else if (ph === 'pause' && L) now = { miss: 'No ' + L.letter, bankrupt: 'Bankrupt', loseTurn: 'Lose a turn', time: 'Time ran out', wrongSolve: 'Wrong solve: “' + (L.guess || '') + '”' }[L.type] || '';
    else if (ph === 'solve') now = pname(g.control) + ' is solving';
    else if (ph === 'solved') now = g.solvedBy ? pname(g.solvedBy) + ' solved it' : 'Nobody solved it';
    else if (/^bonus/.test(ph)) now = 'Bonus round: ' + pname(g.bonus.pid) + (g.bonus.guesses && g.bonus.guesses.length ? ' · last try “' + g.bonus.guesses[g.bonus.guesses.length - 1] + '”' : '');
    else if (ph === 'gameOver') now = 'Game over';
    h += say(now.toUpperCase(), '') + clockBar();
    if (ph !== 'gameOver') h += boardBlock(g);
    if (ph === 'gameOver') {
      h += endBlock(g);
    } else {
      h += '<div class="card" data-key="fix"><h3><span>FIX THINGS</span></h3><div class="hgrid">';
      h += '<button class="btn sm" data-a="undo"' + (hv.canUndo ? '' : ' disabled') + '>Undo</button>';
      h += '<button class="btn sm" data-a="skipTurn"' + (g.kind === 'round' && ['turn', 'call', 'solve', 'pause'].indexOf(ph) >= 0 ? '' : ' disabled') + '>Skip turn</button>';
      h += '<button class="btn sm red" data-a="nobody"' + ((g.kind === 'round' && ['turn', 'call', 'solve', 'pause'].indexOf(ph) >= 0) || (g.kind === 'toss' && ['toss', 'tossAnswer'].indexOf(ph) >= 0) ? '' : ' disabled') + '>Nobody gets it</button>';
      h += '<button class="btn sm" data-a="menu">More…</button></div>';
      var canCount = (g.kind === 'round' && ['turn', 'call', 'solve', 'pause', 'lighting'].indexOf(ph) >= 0) || (g.kind === 'toss' && ['toss', 'tossAnswer'].indexOf(ph) >= 0) || (g.kind === 'bonus' && ph === 'bonusSolve');
      if (canCount) h += '<div class="label">A TYPO THE GAME DIDN’T TAKE? COUNT IT AS SOLVED FOR</div><div class="who">' +
        S.players.filter(function (p) { return g.kind !== 'bonus' || p.id === g.bonus.pid; }).map(function (p) { return '<span><button data-a="solveFor" data-id="' + p.id + '" style="width:auto;border-radius:999px;padding:0 10px;height:28px;background:#2bbd6e">' + esc(p.name) + '</button></span>'; }).join('') + '</div>';
      h += '</div>';
    }
    F.morph($('#host'), h);
    afterPaint(g, ph);
  }
  $('#host').addEventListener('click', function (e) {
    var b = e.target.closest('[data-a]'); if (!b || b.disabled) return;
    var a = b.dataset.a;
    if (a === 'undo') H('undo');
    else if (a === 'skipTurn') H('skipTurn');
    else if (a === 'nobody') { if (confirm('Give up on this puzzle? Nobody wins it.')) H('nobody'); }
    else if (a === 'solveFor') { if (confirm('Count it as solved for ' + pname(b.dataset.id) + '?')) H('solveFor', { id: b.dataset.id }); }
    else if (a === 'menu') openMenu();
    else if (a === 'again') H('lobby');
  });

  function openMenu() {
    menuOpen = true;
    var m = document.createElement('div');
    m.className = 'menu'; m.id = 'menu';
    m.innerHTML = '<div class="in" id="menuIn"></div>';
    document.body.appendChild(m);
    m.addEventListener('click', function (e) {
      var b = e.target.closest('[data-a]'); if (!b) return;
      var a = b.dataset.a;
      if (a === 'close') closeMenu();
      else if (a === 'adj') H('adjust', { id: b.dataset.id, field: b.dataset.f, delta: Number(b.dataset.d) });
      else if (a === 'give') { H('giveTurn', { id: b.dataset.id }); closeMenu(); }
      else if (a === 'kick') { if (confirm('Remove ' + pname(b.dataset.id) + ' from the game?')) H('kick', { id: b.dataset.id }); }
      else if (a === 'joinplay') { if (confirm('Stop hosting and join as a player?')) { send({ t: 'play', on: true }); closeMenu(); } }
      else if (a === 'endGame') { if (confirm('Skip to the final scores?')) { H('endGame'); closeMenu(); } }
      else if (a === 'lobby') { if (confirm('End this game and go back to the lobby? Scores are lost.')) { H('lobby'); closeMenu(); } }
    });
    renderMenu();
  }
  function renderMenu() {
    var root = $('#menuIn'); if (!root || !S || !S.game) { closeMenu(true); return; }
    var g = S.game;
    var h = '<div class="bar"><span><b>HOST MENU</b></span><button class="btn sm" data-a="close" style="width:auto;margin:0;padding:8px 18px 6px">Done</button></div>';
    h += '<div class="card" data-key="m-scores"><h3><span>FIX A SCORE</span><small>ROUND · TOTAL</small></h3>' + S.players.map(function (p) {
      return '<div class="adj" data-key="a' + p.id + '"><span>' + esc(p.name) + '</span>' +
        '<button data-a="adj" data-id="' + p.id + '" data-f="bank" data-d="-250">−</button><b>' + money(g.bank[p.id] || 0) + '</b><button data-a="adj" data-id="' + p.id + '" data-f="bank" data-d="250">+</button>' +
        '<button data-a="adj" data-id="' + p.id + '" data-f="total" data-d="-1000">−</button><b>' + money(g.total[p.id] || 0) + '</b><button data-a="adj" data-id="' + p.id + '" data-f="total" data-d="1000">+</button></div>';
    }).join('') + '<p class="note">Round money moves by $250, totals by $1,000.</p></div>';
    if (g.kind === 'round') h += '<div class="card" data-key="m-give"><h3><span>GIVE THE TURN TO</span></h3><div class="who">' + S.players.map(function (p) { return '<span><button data-a="give" data-id="' + p.id + '" style="width:auto;border-radius:999px;padding:0 10px;height:28px;background:' + (g.control === p.id ? '#ffcc33;color:#2a1800' : '#5a2fd6') + '">' + esc(p.name) + '</button></span>'; }).join('') + '</div></div>';
    h += '<div class="card" data-key="m-players"><h3><span>REMOVE A PLAYER</span></h3><div class="who">' + S.players.map(function (p) { return '<span>' + esc(p.name) + '<button data-a="kick" data-id="' + p.id + '">×</button></span>'; }).join('') + '</div></div>';
    if (S.players.length < S.maxPlayers) h += '<div class="card" data-key="m-play"><h3><span>WANT TO PLAY?</span></h3><p class="note" style="text-align:left;margin-top:0">Stop hosting and join the game at $0. The game keeps running on its own.</p><button class="btn gold" data-a="joinplay">Join as a player</button></div>';
    h += '<button class="btn" data-a="endGame">Skip to the final scores</button>';
    h += '<button class="btn red" data-a="lobby">End the game</button>';
    F.morph(root, h);
  }
  function closeMenu(now) {
    menuOpen = false;
    var m = $('#menu'); if (!m) return;
    if (now || !F.motionOK()) { m.remove(); return; }
    m.classList.add('out'); setTimeout(function () { m.remove(); }, 200);
  }
})();
</script>
</body>
</html>
